---
- name: Install and start nginx
  hosts: localhost
  connection: local
  become: true

  tasks:
   - name: Update apt package cache
     ansible.builtin.apt:
      update_cache: true
   - name: Install Nginx
     ansible.builtin.apt:
      name: nginx
      state: present
   - name: Start and enable
     ansible.builtin.service:
      name: nginx
      state: started
      enabled: true



