apiVersion: apps/v1
kind: Deployment
metadata:
  name: pathnex-deployment
  labels:
    app: pathnex-mini
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pathnex-mini
  template:
    metadata:
      labels:
        app: pathnex-mini
    spec:
      containers:
        - name: web
          image: nginx:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pathnex-service
  labels:
    app: pathnex-mini
spec:
  type: NodePort
  selector:
    app: pathnex-mini
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080

